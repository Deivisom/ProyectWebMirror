<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Web Mirror</title>
    <style>
        /* Estetica basada en el login de Steam moderno */
        body {
            background-color: #1b2838;
            background-image: radial-gradient(circle at top, #2b476c 0%, #1b2838 50%);
            font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
            color: #c6d4df;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #181a21;
            padding: 50px 60px;
            border-radius: 4px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        h2 {
            color: #ffffff;
            font-size: 28px;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #1999ff;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background-color: #32353c;
            border: 1px solid #32353c;
            color: #ffffff;
            border-radius: 3px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background-color: #393c44;
            border-color: #1999ff;
        }

        .buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
        }

        .btn-submit {
            background: linear-gradient(90deg, #06BFFF 0%, #2D73FF 100%);
            color: white;
            border: none;
            padding: 14px 60px;
            font-size: 16px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s ease;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background: linear-gradient(90deg, #06BFFF 0%, #1a9fff 100%);
            box-shadow: 0 0 15px rgba(6, 191, 255, 0.4);
        }

        .help-links {
            margin-top: 30px;
            text-align: center;
        }
        
        .help-links a {
            color: #afafaf;
            text-decoration: underline;
            font-size: 13px;
            transition: color 0.2s;
        }

        .help-links a:hover {
            color: #ffffff;
        }

        .error-message {
            color: #ff5959;
            background: rgba(255, 89, 89, 0.1);
            border: 1px solid #ff5959;
            padding: 12px;
            border-radius: 3px;
            font-size: 14px;
            margin-bottom: 25px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <svg viewBox="0 0 50 50" width="50" height="50" fill="white">
                <path d="M25.004,0C11.196,0,0,11.196,0,25.004C0,38.812,11.196,50,25.004,50C38.812,50,50,38.812,50,25.004 C50,11.196,38.812,0,25.004,0z M35.34,18.064c-3.141,0-5.69,2.549-5.69,5.69c0,0.229,0.016,0.453,0.043,0.673l-6.177,4.316 c-0.655-0.125-1.326-0.198-2.021-0.198c-0.21,0-0.417,0.011-0.622,0.024l-3.328-9.756c0.697-0.78,1.131-1.803,1.131-2.923 c0-2.42-1.968-4.388-4.388-4.388c-2.42,0-4.388,1.968-4.388,4.388c0,1.966,1.299,3.633,3.089,4.2l3.209,9.409 c-2.935,1.144-4.996,3.955-4.996,7.247c0,4.286,3.486,7.771,7.771,7.771c4.286,0,7.771-3.486,7.771-7.771 c0-0.454-0.045-0.897-0.123-1.328l6.812-4.757c0.803,0.297,1.674,0.472,2.587,0.472c4.013,0,7.277-3.264,7.277-7.277 C42.617,21.328,39.352,18.064,35.34,18.064z M9.889,15.891c0-1.045,0.85-1.896,1.896-1.896c1.045,0,1.896,0.85,1.896,1.896 c0,1.045-0.85,1.896-1.896,1.896C10.738,17.787,9.889,16.937,9.889,15.891z M18.97,32.261c0,2.91-2.368,5.278-5.278,5.278 s-5.278-2.368-5.278-5.278c0-2.656,1.968-4.854,4.524-5.228l1.455,4.269c-0.669,0.518-1.096,1.319-1.096,2.222 c0,1.558,1.268,2.825,2.825,2.825c1.558,0,2.825-1.268,2.825-2.825c0-0.87-0.399-1.644-1.018-2.164l1.636-2.585 C20.528,29.805,18.97,32.261,18.97,32.261z M35.34,28.618c-2.684,0-4.869-2.185-4.869-4.869s2.185-4.869,4.869-4.869 s4.869,2.185,4.869,4.869S38.024,28.618,35.34,28.618z" />
            </svg>
            <h2>Iniciar sesión</h2>
        </div>
        
        <form id="loginForm">
            <div class="error-message" id="errorMessage">Nombre de cuenta o contraseña incorrectos.</div>
            
            <div class="form-group">
                <label for="username">Iniciar sesión con el nombre de cuenta</label>
                <input type="text" id="username" autocomplete="off" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>
            
            <div class="buttons">
                <button type="submit" class="btn-submit">Iniciar sesión</button>
            </div>

            <div class="help-links">
                <a href="#">Ayuda, no puedo iniciar sesión</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            if (user === 'akn.raouia' && pass === '1234') {
                errorMsg.style.display = 'none';
                alert('¡Te has logeado exitosamente como akn.raouia!');
                // Redirigir a la página principal después de aceptar la alerta
                window.location.href = 'index.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
