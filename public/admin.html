<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Steam Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        const currentAdminUser = JSON.parse(localStorage.getItem('steam_current_user') || 'null');
        if (!currentAdminUser || currentAdminUser.username !== 'akn.raouia') {
            alert('Acceso denegado. Inicia sesión como akn.raouia para acceder al panel de administración.');
            window.location.href = 'login.html';
        }
    </script>
    <header class="bg-dark text-white p-3">
        <div class="container">
            <h1>Panel de Administración</h1>
            <a href="index.html" class="btn btn-primary">Volver a la Tienda</a>
        </div>
    </header>

    <main class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <h2>Crear/Editar Juego</h2>
                <form id="gameForm">
                    <input type="hidden" id="gameId">
                    <div class="mb-3">
                        <label for="title" class="form-label">Título</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Categoría</label>
                        <select class="form-control" id="category" name="category" required>
                            <option value="destacados">Destacados</option>
                            <option value="descuentos">Descuentos</option>
                            <option value="novedades">Novedades</option>
                            <option value="ventas">Ventas</option>
                            <option value="proximos">Próximos</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="tag" class="form-label">Tag</label>
                        <input type="text" class="form-control" id="tag" name="tag">
                    </div>
                    <div class="mb-3">
                        <label for="main_image" class="form-label">Imagen Principal (URL)</label>
                        <input type="url" class="form-control" id="main_image" name="main_image" required>
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Precio</label>
                        <input type="text" class="form-control" id="price" name="price">
                    </div>
                    <div class="mb-3">
                        <label for="original_price" class="form-label">Precio Original</label>
                        <input type="text" class="form-control" id="original_price" name="original_price">
                    </div>
                    <div class="mb-3">
                        <label for="final_price" class="form-label">Precio Final</label>
                        <input type="text" class="form-control" id="final_price" name="final_price">
                    </div>
                    <div class="mb-3">
                        <label for="discount" class="form-label">Descuento</label>
                        <input type="text" class="form-control" id="discount" name="discount">
                    </div>
                    <div class="mb-3">
                        <label for="screenshots" class="form-label">Screenshots (URLs separadas por coma)</label>
                        <textarea class="form-control" id="screenshots" name="screenshots" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Guardar</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Limpiar</button>
                </form>
            </div>
            <div class="col-md-8">
                <h2>Lista de Juegos</h2>
                <div id="gamesList" class="row"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api/games';

        async function loadGames() {
            try {
                const response = await fetch(API_BASE, {
                    headers: {
                        Authorization: 'Bearer ' + localStorage.getItem('steam_jwt_token')
                    }
                });
                const games = await response.json();
                displayGames(games);
            } catch (error) {
                console.error('Error cargando juegos:', error);
            }
        }

        function displayGames(games) {
            const container = document.getElementById('gamesList');
            container.innerHTML = games.map(game => `
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <img src="${game.main_image}" class="card-img-top" alt="${game.title}">
                        <div class="card-body">
                            <h5 class="card-title">${game.title}</h5>
                            <p class="card-text">Categoría: ${game.category}</p>
                            <p class="card-text">Precio: ${game.price || 'N/A'}</p>
                            <button class="btn btn-primary btn-sm" onclick="editGame(${game.id})">Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteGame(${game.id})">Eliminar</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('gameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const gameData = {
                title: formData.get('title'),
                category: formData.get('category'),
                tag: formData.get('tag'),
                main_image: formData.get('main_image'),
                price: formData.get('price'),
                original_price: formData.get('original_price'),
                final_price: formData.get('final_price'),
                discount: formData.get('discount'),
                screenshots: formData.get('screenshots').split(',').map(url => url.trim()).filter(url => url)
            };

            const gameId = document.getElementById('gameId').value;
            const method = gameId ? 'PUT' : 'POST';
            const url = gameId ? `${API_BASE}/${gameId}` : API_BASE;

            try {
                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + localStorage.getItem('steam_jwt_token')
                    },
                    body: JSON.stringify(gameData)
                });
                if (response.ok) {
                    alert('Juego guardado exitosamente');
                    resetForm();
                    loadGames();
                } else {
                    alert('Error al guardar el juego');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        async function editGame(id) {
            const response = await fetch(`${API_BASE}/${id}`);
            const game = await response.json();
            document.getElementById('gameId').value = game.id;
            document.getElementById('title').value = game.title;
            document.getElementById('category').value = game.category;
            document.getElementById('tag').value = game.tag;
            document.getElementById('main_image').value = game.main_image;
            document.getElementById('price').value = game.price;
            document.getElementById('original_price').value = game.original_price;
            document.getElementById('final_price').value = game.final_price;
            document.getElementById('discount').value = game.discount;
            document.getElementById('screenshots').value = (game.screenshots || []).join(', ');
        }

        async function deleteGame(id) {
            if (confirm('¿Estás seguro de eliminar este juego?')) {
                try {
                    const response = await fetch(`${API_BASE}/${id}`, {
                        method: 'DELETE',
                        headers: {
                            Authorization: 'Bearer ' + localStorage.getItem('steam_jwt_token')
                        }
                    });
                    if (response.ok) {
                        alert('Juego eliminado');
                        loadGames();
                    } else {
                        alert('Error al eliminar');
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }

        function resetForm() {
            document.getElementById('gameForm').reset();
            document.getElementById('gameId').value = '';
        }

        loadGames();
    </script>
</body>
</html>
