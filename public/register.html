<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Web Mirror</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
            color: #c6d4df;
            background-image:
                linear-gradient(180deg, rgba(27, 40, 56, 0.92), rgba(15, 18, 28, 0.95)),
                url("./img/img_nav/banner.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(24, 26, 33, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 32px;
            color: #fff;
            letter-spacing: 1px;
        }

        p {
            color: #b8b8b8;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #89a5cc;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #1f2933;
            border: 1px solid rgba(110, 151, 203, 0.18);
            border-radius: 6px;
            color: #eef2f7;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3f7dff;
            background: #262f38;
        }

        .btn-submit {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 6px;
            background: linear-gradient(90deg, #3a72f5 0%, #1764ff 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.6px;
            margin-top: 10px;
        }

        .error-message {
            display: none;
            background: rgba(255, 84, 84, 0.14);
            color: #ff8f8f;
            border: 1px solid rgba(255, 84, 84, 0.35);
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .footer-text {
            margin-top: 18px;
            color: #8f9ba8;
            font-size: 13px;
            text-align: center;
        }

        .footer-text a {
            color: #d7e1ff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Crear cuenta</h1>
        <p>Regístrate para acceder a tu carrito, favoritos y panel de administración según tu rol.</p>

        <div id="errorMessage" class="error-message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn-submit">Registrarme</button>
        </form>

        <div class="footer-text">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>.
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function clearError() {
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';
        }

        function validateUsername(username) {
            return /^[a-zA-Z0-9_.-]{4,20}$/.test(username);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            clearError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!validateUsername(username)) {
                showError('El nombre de usuario debe tener entre 4 y 20 caracteres y solo puede contener letras, números, puntos, guiones o guiones bajos.');
                return;
            }

            if (!validatePassword(password)) {
                showError('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            if (password !== confirmPassword) {
                showError('Las contraseñas no coinciden.');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (!response.ok) {
                    showError(data.error || 'Error al registrar el usuario.');
                    return;
                }
                window.location.href = 'login.html';
            } catch (error) {
                showError('No se pudo conectar con el servidor. Intenta de nuevo.');
            }
        });
    </script>
</body>
</html>
