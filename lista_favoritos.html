<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Favoritos - Steam</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="top-header">
        <div class="container top-bar">
            <div class="install-section">
                <a href="#" class="btn-install">Instalar Steam</a>
                <a href="#">iniciar sesión</a> | <a href="#">idioma</a>
            </div>
        </div>
        <div class="container main-nav">
            <div class="logo">
                <img src="https://store.cloudflare.steamstatic.com/public/shared/images/header/logo_steam.svg?t=962016" alt="Steam">
            </div>
            <ul class="menu-links">
                <li><a href="index.html">TIENDA</a></li>
                <li><a href="#">COMUNIDAD</a></li>
                <li><a href="#">ACERCA DE</a></li>
                <li><a href="#">SOPORTE</a></li>
            </ul>
        </div>
    </header>

    <main class="container" style="margin-top: 20px;">
        <h1>Tu Lista de Favoritos</h1>
        <div id="wishlist-container">
            <!-- Los juegos favoritos se cargarán aquí -->
        </div>
    </main>

    <footer class="main-footer">
        <div class="container footer-cta">
            <p>¿Buscando recomendaciones?</p>
            <p class="sub-cta">Inicia sesión para ver recomendaciones personalizadas</p>
            <a href="login.html" class="btn-login-footer">Iniciar sesión</a>
            <p class="register-text">O <a href="#">regístrate</a> y únete a Steam de forma gratuita</p>
        </div>
    </footer>

    <script>
        // Cargar lista de favoritos desde localStorage
        let wishlist = JSON.parse(localStorage.getItem("steam_wishlist")) || [];

        function renderWishlist() {
            const wishlistContainer = document.getElementById("wishlist-container");

            if (wishlist.length === 0) {
                wishlistContainer.innerHTML = "<p>No tienes juegos en tu lista de favoritos.</p>";
                return;
            }

            wishlistContainer.innerHTML = wishlist.map(game => `
                <div class="wishlist-item" style="display: flex; align-items: center; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd;">
                    <img src="${game.main_image}" style="width: 80px; height: 80px; margin-right: 15px;">
                    <div style="flex-grow: 1;">
                        <h3>${game.title}</h3>
                        <p>${game.price}</p>
                        <p style="font-size: 12px; opacity: 0.7;">${game.tag}</p>
                    </div>
                    <div>
                        <button onclick="addToCartFromWishlist(${game.id})" style="padding: 5px 10px; background: #66c0f4; color: white; border: none; cursor: pointer; margin-right: 5px;">Añadir al Carrito</button>
                        <button onclick="removeFromWishlist(${game.id})" style="padding: 5px 10px; background: #c33; color: white; border: none; cursor: pointer;">Eliminar</button>
                    </div>
                </div>
            `).join("");
        }

        function removeFromWishlist(id) {
            wishlist = wishlist.filter(game => game.id !== id);
            localStorage.setItem("steam_wishlist", JSON.stringify(wishlist));
            renderWishlist();
        }

        function addToCartFromWishlist(id) {
            let cart = JSON.parse(localStorage.getItem("steam_cart")) || [];
            const game = wishlist.find(g => g.id === id);
            if (game && !cart.some(item => item.id === id)) {
                cart.push(game);
                localStorage.setItem("steam_cart", JSON.stringify(cart));
            }
        }

        // Cargar lista de favoritos al iniciar
        renderWishlist();
    </script>
</body>
</html>
